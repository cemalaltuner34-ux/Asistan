<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Asistan">
    <meta name="theme-color" content="#050507">
    <title>Kişisel Asistanım</title>
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22K%C4%B1%C5%9Fisel%20Asistan%C4%B1m%22%2C%22short_name%22%3A%22Asistan%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23050507%22%2C%22theme_color%22%3A%22%23050507%22%7D">
    <style>
        :root {
            --bg-main: #050507;
            --glass-bg: rgba(20, 22, 30, 0.78);
            --glass-strong: rgba(13, 14, 20, 0.96);
            --border-subtle: rgba(255, 255, 255, 0.1);
            --accent: #6366f1;
            --text-main: #f4f4f6;
            --text-muted: #a1a1aa;
        }
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        input, textarea, select {
            user-select: text;
            font-family: inherit;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            background: radial-gradient(circle at 50% 0%, #121526 0%, var(--bg-main) 65%);
            color: var(--text-main);
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--border-subtle);
        }
        .glass-strong {
            background: var(--glass-strong);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.13);
        }

        /* Gerçek Çentik Hizalı & İçi Saf Siyah (#000000) Dinamik Ada */
        .di-anchor {
            position: fixed;
            top: max(env(safe-area-inset-top), 10px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 45;
            display: flex;
            justify-content: center;
        }
        #di-pill {
            position: relative;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 24px;
            min-height: 36px;
            min-width: 136px;
            max-width: 92vw;
            padding: 0 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.98);
            cursor: pointer;
            will-change: transform, width, height;
        }
        #di-pill.expanded {
            min-height: 44px;
            min-width: 256px;
            padding: 0 18px;
            border-color: rgba(255, 255, 255, 0.25);
        }
        #di-pill.drawer-open {
            min-width: 316px;
            padding: 12px 16px;
            border-radius: 28px;
            border-color: rgba(129, 140, 248, 0.4);
        }
        #di-pill.expanded::before,
        #di-pill.drawer-open::before {
            content: "";
            position: absolute;
            inset: -1.5px;
            border-radius: inherit;
            padding: 1.5px;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #e879f9, #fb7185, #34d399, #38bdf8);
            background-size: 300% 100%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: diAuraFlow 3.5s linear infinite;
            pointer-events: none;
        }
        @keyframes diAuraFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .di-top-row {
            width: 100%;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #000000;
        }
        #di-pill.expanded .di-top-row { height: 44px; }
        .di-waves {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 20px;
        }
        .di-bar {
            width: 3.2px;
            height: 18px;
            border-radius: 99px;
            transform: scaleY(0.28);
            will-change: transform;
            transition: transform 0.08s linear;
        }
        #di-pill.listening .di-bar { background: linear-gradient(180deg, #fda4af, #f43f5e); }
        #di-pill.thinking .di-bar { background: linear-gradient(180deg, #7dd3fc, #818cf8); }
        #di-pill.speaking .di-bar { background: linear-gradient(180deg, #6ee7b7, #10b981); }
        #di-text {
            font-size: 13px;
            font-weight: 500;
            color: #ffffff;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 175px;
        }
        .di-chevron-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: #d4d4d8;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .di-drawer {
            width: 100%;
            padding-top: 10px;
            margin-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: #000000;
        }
        .di-drawer-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 4px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #e4e4e7;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
        }
        .di-drawer-item:active { transform: scale(0.94); }

        /* Üst Kontroller */
        header {
            padding-top: calc(max(env(safe-area-inset-top), 10px) + 52px);
            padding-left: 16px;
            padding-right: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 30;
        }
        .title-badge {
            padding: 6px 14px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .dot-green { background: #34d399; box-shadow: 0 0 8px #34d399; }
        .dot-amber { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e4e4e7;
            cursor: pointer;
        }
        .icon-btn:active, .title-badge:active { transform: scale(0.94); }

        /* Merkez Sahne & Sıvı Işıklı Derin Cam Küre */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            overflow: hidden;
            position: relative;
        }
        .orb-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .orb-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: width 0.45s cubic-bezier(0.34, 1.4, 0.64, 1), height 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
            cursor: pointer;
        }
        .orb-wrapper.compact {
            width: 100px;
            height: 100px;
        }
        .orb-halo {
            position: absolute;
            inset: -24px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(56, 189, 248, 0.16) 45%, transparent 72%);
            filter: blur(22px);
            animation: breatheHalo 5s ease-in-out infinite;
            pointer-events: none;
            transition: background 0.6s ease, transform 0.6s ease;
        }
        .orb-ring-1 {
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top-color: rgba(129, 140, 248, 0.75);
            border-bottom-color: rgba(56, 189, 248, 0.55);
            animation: spinSlow 11s linear infinite;
            pointer-events: none;
        }
        .orb-ring-2 {
            position: absolute;
            inset: 14px;
            border-radius: 50%;
            border: 1px solid rgba(232, 121, 249, 0.22);
            border-left-color: rgba(232, 121, 249, 0.7);
            animation: spinReverse 16s linear infinite;
            pointer-events: none;
        }
        .orb-core {
            position: relative;
            width: 74%;
            height: 74%;
            border-radius: 50%;
            -webkit-mask-image: -webkit-radial-gradient(white, black);
            isolation: isolate;
            background: radial-gradient(circle at 30% 25%, #1e2238 0%, #0b0d17 65%, #040508 100%);
            box-shadow:
                inset 0 2px 14px rgba(255, 255, 255, 0.28),
                inset 0 -14px 26px rgba(79, 70, 229, 0.65),
                0 14px 36px rgba(0, 0, 0, 0.85),
                0 0 32px rgba(99, 102, 241, 0.35);
            overflow: hidden;
            animation: floatOrb 5.5s ease-in-out infinite;
            transition: box-shadow 0.5s ease, transform 0.4s ease;
        }
        .orb-core::after {
            content: "";
            position: absolute;
            top: 8%;
            left: 16%;
            width: 44%;
            height: 22%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.42) 0%, transparent 75%);
            transform: rotate(-22deg);
            pointer-events: none;
        }
        .orb-plasma {
            position: absolute;
            inset: -15%;
            border-radius: 42% 58% 63% 37% / 45% 42% 58% 55%;
            background:
                radial-gradient(circle at 30% 35%, rgba(56, 189, 248, 0.85), transparent 55%),
                radial-gradient(circle at 70% 65%, rgba(168, 85, 247, 0.85), transparent 55%),
                radial-gradient(circle at 50% 80%, rgba(99, 102, 241, 0.9), transparent 60%);
            filter: blur(14px);
            opacity: 0.9;
            animation: liquidMorph 8s ease-in-out infinite alternate, spinSlow 14s linear infinite;
            transition: background 0.5s ease;
        }
        .orb-wrapper.listening .orb-halo {
            background: radial-gradient(circle, rgba(244, 63, 94, 0.5) 0%, rgba(232, 121, 249, 0.22) 52%, transparent 75%);
            transform: scale(1.15);
        }
        .orb-wrapper.listening .orb-core {
            box-shadow:
                inset 0 2px 14px rgba(255, 255, 255, 0.35),
                inset 0 -14px 28px rgba(225, 29, 72, 0.75),
                0 0 38px rgba(244, 63, 94, 0.55);
            transform: scale(1.06);
        }
        .orb-wrapper.listening .orb-plasma {
            background:
                radial-gradient(circle at 30% 35%, rgba(251, 113, 133, 0.9), transparent 55%),
                radial-gradient(circle at 70% 65%, rgba(232, 121, 249, 0.85), transparent 55%),
                radial-gradient(circle at 50% 80%, rgba(225, 29, 72, 0.9), transparent 60%);
        }
        .orb-wrapper.thinking .orb-plasma,
        .orb-wrapper.thinking .orb-ring-1 { animation-duration: 2.2s; }
        .orb-wrapper.speaking .orb-halo {
            background: radial-gradient(circle, rgba(16, 185, 129, 0.48) 0%, rgba(56, 189, 248, 0.22) 52%, transparent 75%);
        }
        .orb-wrapper.speaking .orb-core {
            box-shadow:
                inset 0 2px 14px rgba(255, 255, 255, 0.35),
                inset 0 -14px 28px rgba(5, 150, 105, 0.75),
                0 0 38px rgba(16, 185, 129, 0.5);
            animation: speakPulse 0.8s ease-in-out infinite;
        }
        .orb-wrapper.speaking .orb-plasma {
            background:
                radial-gradient(circle at 30% 35%, rgba(52, 211, 153, 0.9), transparent 55%),
                radial-gradient(circle at 70% 65%, rgba(56, 189, 248, 0.85), transparent 55%),
                radial-gradient(circle at 50% 80%, rgba(16, 185, 129, 0.9), transparent 60%);
        }
        .orb-hint {
            margin-top: 18px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            text-align: center;
        }

        /* Sohbet Balonları */
        #chat-container {
            width: 100%;
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }
        .msg-row-user { display: flex; justify-content: flex-end; }
        .msg-bubble-user {
            background: var(--accent);
            color: #ffffff;
            padding: 10px 15px;
            border-radius: 20px 20px 4px 20px;
            max-width: 82%;
            font-size: 14px;
            line-height: 1.45;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.25);
            word-wrap: break-word;
        }
        .msg-row-ai { display: flex; align-items: flex-start; gap: 10px; }
        .ai-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .msg-bubble-ai {
            padding: 10px 15px;
            border-radius: 20px 20px 20px 4px;
            max-width: 82%;
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-main);
            word-wrap: break-word;
        }
        .msg-bubble-ai img {
            margin-top: 10px;
            border-radius: 14px;
            width: 100%;
            max-width: 280px;
            border: 1px solid rgba(255,255,255,0.12);
        }

        /* Alt Kontrol Çubuğu */
        footer {
            padding: 8px 16px max(env(safe-area-inset-bottom), 16px) 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 30;
        }
        .chips-row {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .chips-row::-webkit-scrollbar { display: none; }
        .chip-btn {
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 500;
            color: #e4e4e7;
            white-space: nowrap;
            cursor: pointer;
        }
        .chip-btn:active { transform: scale(0.95); }
        .chip-danger { color: #fda4af; border-color: rgba(244, 63, 94, 0.3); }

        .input-bar {
            border-radius: 26px;
            padding: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
        }
        .input-bar input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 14px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
        }
        .input-bar input::placeholder { color: #71717a; }
        .action-btn {
            width: 40px;
            height: 40px;
            border-radius: 16px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .action-btn:active { transform: scale(0.93); }
        .btn-mic { background: rgba(255, 255, 255, 0.07); color: #e4e4e7; }
        .btn-send { background: var(--accent); color: #ffffff; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4); }

        /* Modallar */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-backdrop.bottom-sheet {
            align-items: flex-end;
            padding: 0;
        }
        .modal-card {
            width: 100%;
            max-width: 420px;
            border-radius: 28px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .bottom-sheet .modal-card {
            max-width: 100%;
            border-radius: 32px 32px 0 0;
            max-height: 88vh;
            overflow-y: auto;
            padding-bottom: max(env(safe-area-inset-bottom), 24px);
        }
        .form-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #818cf8;
            margin-bottom: 6px;
            display: block;
        }
        .form-control {
            width: 100%;
            background: #18181b;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 12px 14px;
            font-size: 13px;
            color: #ffffff;
            outline: none;
        }
        .form-control:focus { border-color: var(--accent); }
        .primary-btn {
            width: 100%;
            background: var(--accent);
            border: none;
            border-radius: 16px;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
        }
        .secondary-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 16px;
            padding: 12px;
            font-size: 12px;
            font-weight: 600;
            color: #e4e4e7;
            cursor: pointer;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: #e4e4e7;
            padding: 4px 0;
        }
        .toggle-row input { width: 18px; height: 18px; accent-color: var(--accent); }

        /* Toast */
        #toast-box {
            position: fixed;
            top: calc(max(env(safe-area-inset-top), 10px) + 56px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        #toast-text {
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(0, -7px, 0); }
        }
        @keyframes breatheHalo {
            0%, 100% { transform: scale(0.96); opacity: 0.75; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes spinReverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
        @keyframes speakPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }
        @keyframes liquidMorph {
            0% { border-radius: 42% 58% 63% 37% / 45% 42% 58% 55%; transform: scale(0.96); }
            50% { border-radius: 58% 42% 38% 62% / 55% 60% 40% 45%; transform: scale(1.06); }
            100% { border-radius: 46% 54% 52% 48% / 40% 48% 52% 60%; transform: scale(0.98); }
        }
    </style>
</head>
<body>

    <!-- Bildirim Toast -->
    <div id="toast-box">
        <div id="toast-text" class="glass-strong"></div>
    </div>

    <!-- Gerçek Çentik Hizalı & İçi Saf Siyah Dinamik Ada -->
    <div class="di-anchor">
        <div id="di-pill">
            <div class="di-top-row" onclick="unlockAudioContext(); toggleVoiceListening();">
                <div id="di-waves" class="di-waves hidden">
                    <span class="di-bar"></span>
                    <span class="di-bar"></span>
                    <span class="di-bar"></span>
                    <span class="di-bar"></span>
                    <span class="di-bar"></span>
                </div>
                <span id="di-text">Hazır</span>
                <button onclick="event.stopPropagation(); toggleDynamicDrawer();" aria-label="Ada Menüsü" class="di-chevron-btn">
                    <svg id="di-chevron" width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
            </div>

            <!-- Dinamik Ada Hızlı Komut Çekmecesi -->
            <div id="di-drawer" class="di-drawer hidden">
                <button onclick="toggleDynamicDrawer(); toggleVoiceListening();" class="di-drawer-item">
                    <span>🎙️</span><span>Dinle</span>
                </button>
                <button onclick="toggleDynamicDrawer(); openVisionModal();" class="di-drawer-item">
                    <span>👁️</span><span>AI Lens</span>
                </button>
                <button onclick="toggleDynamicDrawer(); openStudioModal();" class="di-drawer-item">
                    <span>✨</span><span>Çizim</span>
                </button>
                <button onclick="toggleDynamicDrawer(); openReminderModal();" class="di-drawer-item">
                    <span>⏰</span><span>Hatırlat</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Üst Kontroller -->
    <header>
        <button onclick="openTitleModal()" id="assistant-title-btn" class="glass title-badge">
            <span id="api-status-dot" class="status-dot dot-amber"></span>
            <span id="assistant-title-text">Kanka</span>
            <svg width="13" height="13" fill="none" stroke="#a1a1aa" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
        </button>

        <div style="display:flex; gap:8px;">

    <script>
        let userTitle = localStorage.getItem('ai_user_title') || "Kanka";
        let isListening = false;
        let recognition = null;
        let chatHistory = [];
        let waveAnimFrame = null;
        let reminders = JSON.parse(localStorage.getItem('ai_reminders') || '[]');

        // iOS Safari Ses Kilidi Açıcı Tekil Audio Nesnesi
        const globalAudioPlayer = new Audio();
        let audioUnlocked = false;
        function unlockAudioContext() {
            if (audioUnlocked) return;
            globalAudioPlayer.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
            globalAudioPlayer.play().then(() => {
                globalAudioPlayer.pause();
                audioUnlocked = true;
            }).catch(() => {});
        }

        // Gerçek Kişilik Modu Karakter Tarifleri
        const PERSONA_PROMPTS = {
            samimi: "Sen kullanıcının en yakın, sadık ve samimi dostusun. Doğal, sıcak, içten ve destekleyici bir dille konuşursun.",
            jarvis: "Sen Tony Stark'ın J.A.R.V.I.S. yapay zekası gibi son derece kibar, analitik, soğukkanlı, yüksek teknolojili ve kusursuz hizmet veren bir sistem asistanısın.",
            ceo: "Sen üst düzey bir yönetici asistanısın. Zamanı verimli kullanır, stratejik düşünür, net ve sonuç odaklı konuşursun.",
            esprili: "Sen zeki, kıvrak zekalı, yerinde espriler yapan, enerjik ve pozitif bir asistansın.",
            bilge: "Sen derin bilgi birikimine sahip, sakin, yol gösterici ve felsefi derinliği olan bilge bir mentorsun.",
            stratejist: "Sen kriz anlarında soğukkanlı çözümler üreten, olasılıkları hesaplayan keskin zekalı bir strateji uzmanısın."
        };

        function getActiveApiKey() {
            return (localStorage.getItem('ai_gemini_key') || '').trim();
        }

        function updateConnectionBadge() {
            const dot = document.getElementById('api-status-dot');
            dot.className = getActiveApiKey() ? "status-dot dot-green" : "status-dot dot-amber";
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('assistant-title-text').textContent = userTitle;
            document.querySelectorAll('.dynamic-user-title').forEach(el => {
                el.textContent = userTitle.toLowerCase();
            });

            const savedKey = localStorage.getItem('ai_gemini_key');
            const savedVoice = localStorage.getItem('ai_voice');
            const savedPersona = localStorage.getItem('ai_persona');
            const savedLength = localStorage.getItem('ai_length');
            const savedTypingSpeech = localStorage.getItem('ai_typing_speech');
            const savedShake = localStorage.getItem('ai_shake_enabled');
            const savedCustomCss = localStorage.getItem('ai_custom_css');

            if (savedKey) document.getElementById('setting-api-key').value = savedKey;
            if (savedVoice) document.getElementById('setting-voice').value = savedVoice;
            if (savedPersona) document.getElementById('setting-persona').value = savedPersona;
            if (savedLength) document.getElementById('setting-length').value = savedLength;
            if (savedTypingSpeech === 'true') document.getElementById('setting-typing-speech').checked = true;
            if (savedShake === 'false') document.getElementById('setting-shake').checked = false;
            if (savedCustomCss) injectCustomStyle(savedCustomCss);

            updateConnectionBadge();
            restoreSavedChat();
            renderReminders();
            setInterval(checkDueReminders, 5000);

            const params = new URLSearchParams(window.location.search);
            if (params.get('listen') === '1') {
                setTimeout(() => toggleVoiceListening(), 350);
            }
        });

        function restoreSavedChat() {
            const saved = JSON.parse(localStorage.getItem('ai_saved_messages') || '[]');
            if (saved.length > 0) {
                saved.forEach(item => renderMessageBubble(item.role, item.text, item.imageUrl || null));
            }
        }

        function saveMessageToStorage(role, text, imageUrl = null) {
            const saved = JSON.parse(localStorage.getItem('ai_saved_messages') || '[]');
            saved.push({ role, text, imageUrl });
            if (saved.length > 40) saved.splice(0, saved.length - 40);
            localStorage.setItem('ai_saved_messages', JSON.stringify(saved));
        }

        function injectCustomStyle(cssCode) {
            let styleTag = document.getElementById('ai-evolution-style');
            if (!styleTag) {
                styleTag = document.createElement('style');
                styleTag.id = 'ai-evolution-style';
                document.head.appendChild(styleTag);
            }
            styleTag.textContent = cssCode;
        }

        function showToast(msg) {
            const box = document.getElementById('toast-box');
            document.getElementById('toast-text').textContent = msg;
            box.style.opacity = '1';
            setTimeout(() => { box.style.opacity = '0'; }, 3000);
        }

        function toggleDynamicDrawer() {
            const pill = document.getElementById('di-pill');
            const drawer = document.getElementById('di-drawer');
            const chevron = document.getElementById('di-chevron');
            const isOpen = !drawer.classList.contains('hidden');

            if (isOpen) {
                drawer.classList.add('hidden');
                pill.classList.remove('drawer-open');
                chevron.style.transform = 'rotate(0deg)';
            } else {
                drawer.classList.remove('hidden');
                pill.classList.add('drawer-open');
                chevron.style.transform = 'rotate(180deg)';
            }
        }

        function setAssistantState(state, label = 'Hazır') {
            const orb = document.getElementById('ai-orb');
            const pill = document.getElementById('di-pill');
            const waves = document.getElementById('di-waves');
            const diText = document.getElementById('di-text');

            orb.classList.remove('listening', 'thinking', 'speaking');
            pill.classList.remove('listening', 'thinking', 'speaking');

            if (state === 'idle') {
                stopDynamicWaveMeter();
                pill.classList.remove('expanded');
                waves.classList.add('hidden');
                diText.textContent = 'Hazır';
            } else {
                orb.classList.add(state);
                pill.classList.add('expanded', state);
                waves.classList.remove('hidden');
                diText.textContent = label;
                startDynamicWaveMeter(state);
            }
        }

        function startDynamicWaveMeter(mode) {
            stopDynamicWaveMeter();
            const bars = document.querySelectorAll('.di-bar');
            let phase = 0;
            const speed = mode === 'speaking' ? 0.25 : (mode === 'listening' ? 0.19 : 0.13);

            const animateWaves = () => {
                phase += speed;
                for (let i = 0; i < bars.length; i++) {
                    const wave = Math.sin(phase + i * 1.15) * 0.42 + 0.65;
                    bars[i].style.transform = `scaleY(${Math.max(0.25, wave)})`;
                }
                waveAnimFrame = requestAnimationFrame(animateWaves);
            };
            animateWaves();
        }

        function stopDynamicWaveMeter() {
            if (waveAnimFrame) {
                cancelAnimationFrame(waveAnimFrame);
                waveAnimFrame = null;
            }
            document.querySelectorAll('.di-bar').forEach(bar => {
                bar.style.transform = 'scaleY(0.28)';
            });
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function openSettings() { openModal('settings-modal'); }
        function openStudioModal() { openModal('studio-modal'); }
        function openShakeModal() { openModal('shake-modal'); }
        function openReminderModal() { renderReminders(); openModal('reminder-modal'); }

        function openTitleModal() {
            document.getElementById('title-input').value = userTitle;
            openModal('title-modal');
        }
        function saveUserTitle() {
            const val = document.getElementById('title-input').value.trim();
            if (val) {
                userTitle = val;
                localStorage.setItem('ai_user_title', userTitle);
                document.getElementById('assistant-title-text').textContent = userTitle;
                document.querySelectorAll('.dynamic-user-title').forEach(el => {
                    el.textContent = userTitle.toLowerCase();
                });
                closeModal('title-modal');
                showToast(`Hitap güncellendi: ${userTitle}`);
                speakWithGeminiTTS(`Tamamdır ${userTitle}, bundan sonra sana bu şekilde hitap edeceğim.`, true);
            }
        }

        function renderMessageBubble(role, text, imageUrl = null) {
            const container = document.getElementById('chat-container');
            const orb = document.getElementById('ai-orb');
            const hint = document.getElementById('orb-hint');
            const clearBtn = document.getElementById('clear-btn');

            container.classList.remove('hidden');
            clearBtn.classList.remove('hidden');
            orb.classList.add('compact');
            hint.classList.add('hidden');

            const wrapper = document.createElement('div');
            if (role === 'user') {
                wrapper.className = 'msg-row-user';
                wrapper.innerHTML = `<div class="msg-bubble-user">${escapeHtml(text)}</div>`;
            } else {
                wrapper.className = 'msg-row-ai';
                const imgHtml = imageUrl ? `<img src="${imageUrl}" alt="AI Görsel">` : '';
                wrapper.innerHTML = `
                    <div class="ai-avatar">AI</div>
                    <div class="glass msg-bubble-ai">${formatText(text)}${imgHtml}</div>
                `;
            }
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        function appendMessage(role, text, imageUrl = null) {
            renderMessageBubble(role, text, imageUrl);
            saveMessageToStorage(role, text, imageUrl);
        }

        function clearChat() {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            chatHistory = [];
            localStorage.removeItem('ai_saved_messages');
            container.classList.add('hidden');
            document.getElementById('clear-btn').classList.add('hidden');
            document.getElementById('ai-orb').classList.remove('compact');
            document.getElementById('orb-hint').classList.remove('hidden');
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
        }
        function formatText(str) {
            return escapeHtml(str).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
        }

        function addNewReminder(customText = null, customMins = null) {
            const text = customText || document.getElementById('reminder-text-input').value.trim();
            const mins = customMins || parseInt(document.getElementById('reminder-mins-input').value, 10);
            if (!text || isNaN(mins) || mins <= 0) return;

            const dueTime = Date.now() + mins * 60000;
            reminders.push({ id: Date.now(), text, dueTime, triggered: false });
            localStorage.setItem('ai_reminders', JSON.stringify(reminders));

            if (!customText) {
                document.getElementById('reminder-text-input').value = '';
                renderReminders();
                showToast(`Hatırlatıcı kuruldu: ${mins} dk sonra`);
            }
        }

        function deleteReminder(id) {
            reminders = reminders.filter(r => r.id !== id);
            localStorage.setItem('ai_reminders', JSON.stringify(reminders));
            renderReminders();
        }

        function renderReminders() {
            const list = document.getElementById('reminder-list');
            if (!list) return;
            if (reminders.length === 0) {
                list.innerHTML = `<p style="font-size:12px; color:#71717a; text-align:center; padding:8px;">Aktif hatırlatıcı yok.</p>`;
                return;
            }
            list.innerHTML = reminders.map(r => {
                const remMins = Math.max(0, Math.ceil((r.dueTime - Date.now()) / 60000));
                return `
                    <div class="glass" style="padding:10px 12px; border-radius:14px; display:flex; align-items:center; justify-content:space-between; font-size:12px;">
                        <span>⏰ <strong>${escapeHtml(r.text)}</strong> (${remMins} dk)</span>
                        <button onclick="deleteReminder(${r.id})" style="background:none; border:none; color:#fda4af; font-weight:700; cursor:pointer;">Sil</button>
                    </div>
                `;
            }).join('');
        }

        function checkDueReminders() {
            let changed = false;
            reminders.forEach(r => {
                if (!r.triggered && Date.now() >= r.dueTime) {
                    r.triggered = true;
                    changed = true;
                    const alertMsg = `⏰ Hatırlatıcı zamanı geldi ${userTitle}: ${r.text}`;
                    appendMessage('ai', alertMsg);
                    speakWithGeminiTTS(alertMsg, true);
                }
            });
            if (changed) {
                reminders = reminders.filter(r => !r.triggered);
                localStorage.setItem('ai_reminders', JSON.stringify(reminders));
                renderReminders();
            }
        }

        function checkLocalCommands(text) {
            const clean = text.trim();
            const remMatch = clean.match(/(\d+)\s*dakika\s*sonra\s+(.+?)\s*hatırlat/i);
            if (remMatch) {
                const mins = parseInt(remMatch[1], 10);
                const task = remMatch[2].trim();
                addNewReminder(task, mins);
                return `Tamamdır ${userTitle}, ${mins} dakika sonra "${task}" için hatırlatıcı kurdum.`;
            }

            if (/\bwhatsapp('ı|i|tan)?\s*(aç|başlat|ara)\b/i.test(clean)) {
                setTimeout(() => { window.location.href = "whatsapp://"; }, 800);
                return `WhatsApp başlatılıyor ${userTitle}...`;
            }
            if (/\bspotify('ı|i|dan)?\s*(aç|başlat|çal)\b/i.test(clean)) {
                setTimeout(() => { window.location.href = "spotify://"; }, 800);
                return `Spotify açılıyor ${userTitle}...`;
            }
            if (/\b(haritalar|navigasyon)('ı|i)?\s*(aç|başlat)\b/i.test(clean)) {
                setTimeout(() => { window.location.href = "maps://"; }, 800);
                return `Haritalar başlatılıyor ${userTitle}...`;
            }
            if (/\bnotlar('ı|i)?\s*aç\b/i.test(clean)) {
                setTimeout(() => { window.location.href = "mobilenotes://"; }, 800);
                return `Apple Notlar açılıyor ${userTitle}...`;
            }
            return null;
        }

        async function callGeminiChat(promptText, base64Image = null) {
            const localReply = checkLocalCommands(promptText);
            if (localReply) return localReply;

            const activeKey = getActiveApiKey();
            if (!activeKey) {
                setAssistantState('idle');
                openSettings();
                return `Önce sağ üstteki Komuta Kontrol Merkezi'nden Gemini API anahtarını girip kaydetmelisin ${userTitle}.`;
            }

            setAssistantState('thinking', 'Düşünüyor...');
            const personaKey = document.getElementById('setting-persona').value;
            const personaDesc = PERSONA_PROMPTS[personaKey] || PERSONA_PROMPTS.samimi;
            const lengthMode = document.getElementById('setting-length').value;
            const lengthHint = lengthMode === 'short' ? 'Maksimum 2 cümlelik çok kısa ve net yanıt ver.' : (lengthMode === 'detailed' ? 'Kapsamlı ve detaylı analiz yap.' : 'Dengeli ve doğal uzunlukta yanıt ver.');

            const sysInstruction = `${personaDesc} Kullanıcıya "${userTitle}" diye hitap et. ${lengthHint} Akıcı Türkçe konuş.`;

            const currentParts = [{ text: promptText }];
            if (base64Image) {
                currentParts.push({ inlineData: { mimeType: "image/jpeg", data: base64Image } });
            }

            chatHistory.push({ role: "user", parts: currentParts });
            if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);

            const payload = {
                contents: chatHistory,
                tools: [{ google_search: {} }],
                systemInstruction: { parts: [{ text: sysInstruction }] }
            };

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${activeKey}`;
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) {
                    const errDetail = data?.error?.message || `HTTP ${res.status}`;
                    return `API Hatası (${res.status}): ${errDetail}`;
                }
                const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (reply) {
                    chatHistory.push({ role: "model", parts: [{ text: reply }] });
                    return reply;
                }
                return `Model boş yanıt döndürdü ${userTitle}.`;
            } catch (e) {
                return `Ağ Bağlantı Hatası: ${e.message}`;
            }
        }

        async function speakWithGeminiTTS(text, isVoiceInput = false) {
            globalAudioPlayer.pause();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            const typingSpeechAllowed = document.getElementById('setting-typing-speech').checked;
            if (!isVoiceInput && !typingSpeechAllowed) {
                setAssistantState('idle');
                return;
            }

            setAssistantState('speaking', 'Konuşuyor...');
            const selectedVoice = document.getElementById('setting-voice').value;
            const cleanText = text.replace(/[*#_`]/g, '').slice(0, 450);
            const activeKey = getActiveApiKey();

            if (activeKey) {
                const payload = {
                    contents: [{ parts: [{ text: cleanText }] }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: {
                            voiceConfig: {
                                prebuiltVoiceConfig: { voiceName: selectedVoice }
                            }
                        }
                    }
                };

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${activeKey}`;
                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await res.json();
                    const part = result?.candidates?.[0]?.content?.parts?.[0];
                    const audioData = part?.inlineData?.data;
                    const mimeType = part?.inlineData?.mimeType || '';

                    if (audioData && mimeType.startsWith('audio/')) {
                        const rateMatch = mimeType.match(/rate=(\d+)/);
                        const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
                        const pcmBytes = Uint8Array.from(atob(audioData), c => c.charCodeAt(0));
                        const wavBlob = pcmToWav(new Int16Array(pcmBytes.buffer), sampleRate);
                        const audioUrl = URL.createObjectURL(wavBlob);

                        globalAudioPlayer.src = audioUrl;
                        globalAudioPlayer.onended = () => {
                            URL.revokeObjectURL(audioUrl);
                            setAssistantState('idle');
                        };
                        await globalAudioPlayer.play();
                        return;
                    }
                } catch (e) {}
            }

            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance(cleanText);
                u.lang = 'tr-TR';
                u.onend = () => setAssistantState('idle');
                window.speechSynthesis.speak(u);
            } else {
                setAssistantState('idle');
            }
        }

        function pcmToWav(pcm16, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcm16.length * 2);
            const view = new DataView(buffer);
            const writeStr = (off, s) => {
                for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i));
            };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + pcm16.length * 2, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, pcm16.length * 2, true);
            for (let i = 0; i < pcm16.length; i++) view.setInt16(44 + i * 2, pcm16[i], true);
            return new Blob([buffer], { type: 'audio/wav' });
        }

        function testSelectedVoice() {
            const v = document.getElementById('setting-voice').value;
            speakWithGeminiTTS(`Selam ${userTitle}, şu an ${v} ses tonuyla konuşuyorum.`, true);
        }

        async function sendMessage(voicePrompt = null) {
            const input = document.getElementById('user-input');
            const text = voicePrompt || input.value.trim();
            if (!text) return;
            if (!voicePrompt) input.value = '';

            appendMessage('user', text);
            const reply = await callGeminiChat(text);
            appendMessage('ai', reply);
            await speakWithGeminiTTS(reply, Boolean(voicePrompt));
        }

        function toggleVoiceListening() {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().catch(() => {});
            }

            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                showToast("Tarayıcı ses tanımayı desteklemiyor");
                return;
            }
            if (isListening && recognition) {
                recognition.stop();
                isListening = false;
                setAssistantState('idle');
                return;
            }

            recognition = new SpeechRec();
            recognition.lang = 'tr-TR';
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                setAssistantState('listening', 'Seni dinliyorum...');
            };
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                isListening = false;
                sendMessage(transcript);
            };
            recognition.onerror = (e) => {
                isListening = false;
                setAssistantState('idle');
                if (e.error !== 'no-speech') showToast(`Mikrofon Hatası: ${e.error}`);
            };
            recognition.onend = () => {
                if (isListening) {
                    isListening = false;
                    setAssistantState('idle');
                }
            };
            recognition.start();
        }

        async function generateAIImage() {
            const prompt = document.getElementById('image-prompt-input').value.trim();
            if (!prompt) return;
            const activeKey = getActiveApiKey();
            if (!activeKey) {
                closeModal('studio-modal');
                openSettings();
                showToast("Önce API anahtarını kaydet");
                return;
            }

            closeModal('studio-modal');
            appendMessage('user', `✨ Görsel: ${prompt}`);
            setAssistantState('thinking', 'Görsel çiziliyor...');

            const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key=${activeKey}`;
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        instances: [{ prompt: prompt }],
                        parameters: { sampleCount: 1 }
                    })
                });
                const result = await res.json();
                if (!res.ok) {
                    const errMsg = result?.error?.message || `HTTP ${res.status}`;
                    setAssistantState('idle');
                    appendMessage('ai', `Görsel Oluşturma Hatası: ${errMsg}`);
                    return;
                }
                const base64Data = result?.predictions?.[0]?.bytesBase64Encoded;
                if (base64Data) {
                    appendMessage('ai', `İşte istediğin görsel ${userTitle}!`, `data:image/png;base64,${base64Data}`);
                    setAssistantState('idle');
                    return;
                }
            } catch (e) {
                appendMessage('ai', `Görsel Bağlantı Hatası: ${e.message}`);
            }
            setAssistantState('idle');
        }

        function openVisionModal() {
            openModal('vision-modal');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(stream => {
                    document.getElementById('camera-preview').srcObject = stream;
                })
                .catch(err => {
                    closeVisionModal();
                    showToast(`Kamera Hatası: ${err.message}`);
                });
        }
        function closeVisionModal() {
            const video = document.getElementById('camera-preview');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                video.srcObject = null;
            }
            closeModal('vision-modal');
        }
        async function captureAndAnalyze() {
            const video = document.getElementById('camera-preview');
            const canvas = document.getElementById('camera-canvas');
            const prompt = document.getElementById('vision-prompt').value.trim() || "Bu görüntüde ne görüyorsun? Detaylı açıkla.";
            if (!video.videoWidth) return;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const base64Img = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

            closeVisionModal();
            appendMessage('user', `👁️ Kamera Analizi: ${prompt}`);
            const reply = await callGeminiChat(prompt, base64Img);
            appendMessage('ai', reply);
            await speakWithGeminiTTS(reply, false);
        }

        async function applyLiveEvolution() {
            const cmd = document.getElementById('evolve-command').value.trim();
            if (!cmd) return;
            const activeKey = getActiveApiKey();
            if (!activeKey) {
                closeModal('shake-modal');
                openSettings();
                showToast("Önce API anahtarını kaydet");
                return;
            }

            closeModal('shake-modal');
            setAssistantState('thinking', 'Arayüz kodlanıyor...');

            const cssPrompt = `Sen bir kıdemli iOS UI/CSS mühendisisin. Kullanıcının şu arayüz değişikliği isteğini sadece geçerli ham CSS kodu olarak yaz (markdown bloğu veya açıklama ekleme, sadece CSS kuralları döndür, gerekirse !important kullan): "${cmd}". Mevcut sınıflar: body, .orb-core, .orb-halo, .glass, .glass-strong, #di-pill.`;
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${activeKey}`;

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: cssPrompt }] }] })
                });
                const data = await res.json();
                if (!res.ok) {
                    showToast(`Kodlama Hatası: ${data?.error?.message || res.status}`);
                    setAssistantState('idle');
                    return;
                }
                let generatedCss = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
                generatedCss = generatedCss.replace(/```css|```/g, '').trim();

                if (generatedCss) {
                    const prevCss = localStorage.getItem('ai_custom_css') || '';
                    const combinedCss = prevCss + "\n" + generatedCss;
                    localStorage.setItem('ai_custom_css', combinedCss);
                    injectCustomStyle(combinedCss);
                    showToast("Canlı arayüz yaması kodlandı ve uygulandı!");
                }
            } catch (e) {
                showToast(`Evrim Bağlantı Hatası: ${e.message}`);
            }
            setAssistantState('idle');
        }

        function resetLiveEvolution() {
            localStorage.removeItem('ai_custom_css');
            const styleTag = document.getElementById('ai-evolution-style');
            if (styleTag) styleTag.remove();
            closeModal('shake-modal');
            showToast("Tasarım orijinal haline döndürüldü");
        }

        let lastX = 0, lastY = 0, lastZ = 0, lastShakeTime = 0;
        window.addEventListener('devicemotion', (e) => {
            if (!document.getElementById('setting-shake').checked) return;
            const acc = e.accelerationIncludingGravity;
            if (!acc) return;
            const delta = Math.abs(acc.x - lastX) + Math.abs(acc.y - lastY) + Math.abs(acc.z - lastZ);
            if (delta > 28 && (Date.now() - lastShakeTime) > 2500) {
                lastShakeTime = Date.now();
                openShakeModal();
            }
            lastX = acc.x;
            lastY = acc.y;
            lastZ = acc.z;
        }, { passive: true });

        function saveSettings() {
            localStorage.setItem('ai_gemini_key', document.getElementById('setting-api-key').value.trim());
            localStorage.setItem('ai_voice', document.getElementById('setting-voice').value);
            localStorage.setItem('ai_persona', document.getElementById('setting-persona').value);
            localStorage.setItem('ai_length', document.getElementById('setting-length').value);
            localStorage.setItem('ai_typing_speech', document.getElementById('setting-typing-speech').checked);
            localStorage.setItem('ai_shake_enabled', document.getElementById('setting-shake').checked);
            updateConnectionBadge();
            closeModal('settings-modal');
            showToast("Tüm ayarlar kaydedildi");
        }
    </script>
